kind = "mobile"
previewPath = "/"
title = "Bookshelf AR Catalog"
description = "A local mobile library app that scans ISBNs, lets users edit book metadata, places books on one bookcase level with ARKit, and helps locate them later with an AR marker."
version = "1.0.0"
id = "artifacts/bookshelf-ar-catalog"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 23325

[services.development]
run = "pnpm --filter @workspace/bookshelf-ar-catalog run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bookshelf-ar-catalog", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/bookshelf-ar-catalog", "run", "serve" ]

[services.env]
PORT = "23325"
BASE_PATH = "/"
